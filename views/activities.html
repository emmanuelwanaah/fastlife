<script>
document.addEventListener('DOMContentLoaded', async () => {

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  const container = document.getElementById('activity-grid');
  const countDisplay = document.getElementById('wishlist-count');
  const heading = document.getElementById('location-heading');

  if (!container) {
    console.error('❌ #activity-grid was not found.');
    return;
  }

  if (!id) {
    container.innerHTML = `
      <p class="text-red-600 col-span-full">
        Invalid explore ID.
      </p>
    `;
    return;
  }

  try {

    /* ========================================
       GET EXPLORE LOCATION
    ======================================== */

    const exploreRes = await fetch(`/api/explore/${id}`);

    if (!exploreRes.ok) {
      throw new Error('Failed to load explore location');
    }

    const explore = await exploreRes.json();

    if (heading) {
      heading.textContent = `Activities in ${explore.location}`;
    }


    /* ========================================
       GET ACTIVITIES
    ======================================== */

    const activitiesRes = await fetch(
      `/api/activities?location=${encodeURIComponent(explore.location)}`
    );

    if (!activitiesRes.ok) {
      throw new Error('Failed to load activities');
    }

    const activities = await activitiesRes.json();

    console.log('Activities loaded:', activities);


    /* ========================================
       GET WISHLIST
    ======================================== */

    const wishlistRes = await fetch('/api/wishlist', {
      credentials: 'include'
    });

    let wishlist = [];

    if (wishlistRes.ok) {
      wishlist = await wishlistRes.json();
    }

    /*
      Your wishlist API returns:

      a.*

      Therefore:
      item.id = activity ID
    */

    const wishlistSet = new Set(
      wishlist.map(item => Number(item.id))
    );

    if (countDisplay) {
      countDisplay.textContent = wishlistSet.size;
    }


    /* ========================================
       NO ACTIVITIES
    ======================================== */

    if (!Array.isArray(activities) || activities.length === 0) {

      container.innerHTML = `
        <div class="col-span-full py-16 text-center">
          <p class="text-gray-500 text-sm">
            No activities found in ${explore.location}.
          </p>
        </div>
      `;

      return;
    }


    /* ========================================
       CREATE ACTIVITY CARDS
    ======================================== */

    container.innerHTML = activities.map(act => {

      const activityId = Number(act.id);
      const isInWishlist = wishlistSet.has(activityId);

      return `
        <article
          class="relative flex flex-col overflow-hidden rounded-2xl bg-white"
          data-id="${activityId}"
        >

          <!-- IMAGE -->
          <div class="relative aspect-[4/3] w-full overflow-hidden">

            <img
              src="${act.image_url || ''}"
              alt="${act.title || 'Activity'}"
              class="h-full w-full object-cover"
            />

            <!-- WISHLIST HEART -->
           <button
  type="button"
  class="wishlist-btn absolute top-3 right-3 z-10 w-11 h-11 rounded-full bg-white flex items-center justify-center shadow-sm cursor-pointer"
  data-id="${activityId}"
  aria-label="${isInWishlist ? 'Remove from wishlist' : 'Add to wishlist'}"
>
  <svg
    class="wishlist-icon w-5 h-5 ${isInWishlist ? 'fill-red-500 stroke-red-500' : 'fill-none stroke-gray-700'}"
    viewBox="0 0 24 24"
    stroke-width="2"
    stroke="currentColor"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"
    />
  </svg>
</button>

          </div>


          <!-- CONTENT -->
          <div class="flex flex-1 flex-col p-4">

            <!-- CATEGORY -->
            <p class="mb-1 text-xs font-medium uppercase tracking-wide text-gray-400">
              ${act.category_name || 'Activity'}
            </p>


            <!-- TITLE -->
            <h3
              class="line-clamp-2 text-base font-semibold leading-snug text-gray-900"
            >
              ${act.title || ''}
            </h3>


            <!-- LOCATION -->
            <div class="mt-2 flex items-center gap-1.5 text-sm text-gray-500">

              <span class="material-symbols-outlined text-[17px]">
                location_on
              </span>

              <span>
                ${act.location || ''}
              </span>

            </div>


            <!-- BOTTOM -->
            <div class="mt-4 flex items-center justify-between">

              <!-- PRICE -->
              <div>

                <span class="text-xs text-gray-400">
                  From
                </span>

                <div class="text-lg font-bold text-gray-900">
                  €${Number(act.price || 0).toFixed(2)}
                </div>

              </div>


              <!-- VIEW BUTTON -->
              <a
                href="activity-details.html?id=${activityId}"
                class="inline-flex items-center gap-1 rounded-lg bg-gray-900 px-4 py-2.5 text-sm font-medium text-white"
              >
                View

                <span class="material-symbols-outlined text-[17px]">
                  arrow_forward
                </span>

              </a>

            </div>

          </div>

        </article>
      `;

    }).join('');


    /* ========================================
       WISHLIST CLICK HANDLER
    ======================================== */

   /* ========================================
   WISHLIST CLICK HANDLER
======================================== */

container
  .querySelectorAll('.wishlist-btn')
  .forEach(button => {

    button.addEventListener('click', async event => {

      event.preventDefault();
      event.stopPropagation();

      const activityId = Number(button.dataset.id);

      if (!activityId) {
        console.error('❌ Invalid activity ID');
        return;
      }

      const isInWishlist = wishlistSet.has(activityId);

      if (button.disabled) return;

      button.disabled = true;

      const icon = button.querySelector('.wishlist-icon');

      // Small press animation
      button.classList.add('scale-90');

      try {

        const response = await fetch('/api/wishlist', {
          method: isInWishlist ? 'DELETE' : 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          credentials: 'include',

          body: JSON.stringify({
            activity_id: activityId
          })
        });

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

       if (!response.ok) {

  // User is not logged in
  if (response.status === 401) {
    window.location.href =
      `/login.html?redirect=${encodeURIComponent(window.location.href)}`;
    return;
  }

  throw new Error(
    data.error ||
    data.message ||
    'Wishlist update failed.'
  );
}

        /* ========================================
           ADD TO WISHLIST
        ======================================== */

        if (!isInWishlist) {

          wishlistSet.add(activityId);

          if (icon) {
            icon.classList.remove(
              'fill-none',
              'stroke-gray-700'
            );

            icon.classList.add(
              'fill-red-500',
              'stroke-red-500'
            );

            // Heart animation
            icon.classList.remove('wishlist-pop');
            void icon.offsetWidth;
            icon.classList.add('wishlist-pop');
          }

          button.setAttribute(
            'aria-label',
            'Remove from wishlist'
          );

        }

        /* ========================================
           REMOVE FROM WISHLIST
        ======================================== */

        else {

          wishlistSet.delete(activityId);

          if (icon) {

            icon.classList.remove(
              'fill-red-500',
              'stroke-red-500',
              'wishlist-pop'
            );

            icon.classList.add(
              'fill-none',
              'stroke-gray-700'
            );

          }

          button.setAttribute(
            'aria-label',
            'Add to wishlist'
          );

        }

        /* ========================================
           UPDATE COUNT
        ======================================== */

        if (countDisplay) {
          countDisplay.textContent = wishlistSet.size;
        }

      } catch (error) {

        console.error(
          '❌ Failed to update wishlist:',
          error
        );

        alert(
          error.message ||
          'Unable to update wishlist. Please try again.'
        );

      } finally {

        // Return button to normal size
        setTimeout(() => {
          button.classList.remove('scale-90');
        }, 120);

        button.disabled = false;
      }

    });

  });

  } catch (error) {

    console.error(
      '❌ Error loading activities:',
      error
    );

    container.innerHTML = `
      <div class="col-span-full py-16 text-center">

        <p class="text-red-600 text-sm">
          Failed to load activities.
        </p>

      </div>
    `;

  }

});
</script>
