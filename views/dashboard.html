<script>
document.addEventListener('DOMContentLoaded', () => {

  let currentSort = '';
  let searchTerm = '';
  let currentPage = 1;
  const limit = 6;

  const container = document.getElementById('experience-grid');
  const pagination = document.getElementById('pagination');
  const searchInput = document.getElementById('search');

  if (!container) {
    console.error('❌ #experience-grid not found');
    return;
  }


  // ========================================
  // GET URL PARAMETERS
  // ========================================

  const urlParams = new URLSearchParams(window.location.search);

  const searchFromUrl = urlParams.get('search');
  const selectedDestination = urlParams.get('destination');

  console.log('Selected destination:', selectedDestination);

  if (searchFromUrl) {
    searchTerm = searchFromUrl;

    if (searchInput) {
      searchInput.value = searchFromUrl;
    }
  }


  // ========================================
  // FETCH EXPLORE DATA
  // ========================================

  async function fetchexplore() {

    try {

      const params = new URLSearchParams();

      if (currentSort) {
        params.append('sortBy', currentSort);
      }

      if (searchTerm) {
        params.append('search', searchTerm);
      }

      params.append('page', currentPage);
      params.append('limit', limit);


      const res = await fetch(
        `/api/explore?${params.toString()}`
      );


      if (!res.ok) {
        throw new Error('Failed to load destinations');
      }


      let data = await res.json();

      console.log('Explore data:', data);


      // ========================================
      // DESTINATION FILTER
      // ========================================

      if (selectedDestination) {

        data = data.filter(exp =>
          String(exp.location || '').toLowerCase() ===
          String(selectedDestination).toLowerCase()
        );

      }


      // ========================================
      // NO RESULTS
      // ========================================

      if (!Array.isArray(data) || data.length === 0) {

        container.innerHTML = `
          <div class="col-span-full text-center py-16">

            <div class="mx-auto mb-5 w-14 h-14 rounded-full bg-surface-container flex items-center justify-center">

              <span class="material-symbols-outlined text-on-surface-variant text-[26px]">
                travel_explore
              </span>

            </div>

            <h3 class="text-headline-md font-headline-md text-on-surface">
              No destinations found
            </h3>

            <p class="mt-2 text-on-surface-variant text-label-md">
              No results found for
              "<strong>${searchTerm || selectedDestination || ''}</strong>"
            </p>

            <button
              id="suggestCaribbean"
              type="button"
              class="mt-5 text-primary font-medium hover:underline"
            >
              Try Caribbean
            </button>

          </div>
        `;


        if (pagination) {
          pagination.innerHTML = '';
        }


        // ========================================
        // CARIBBEAN SUGGESTION
        // ========================================

        const suggestion =
          document.getElementById('suggestCaribbean');

        if (suggestion) {

          suggestion.addEventListener('click', () => {

            searchTerm = 'Caribbean';
            currentPage = 1;

            if (searchInput) {
              searchInput.value = 'Caribbean';
            }

            fetchexplore();

          });

        }

        return;
      }


      // ========================================
      // RENDER STITCH DESIGN
      // ========================================

      container.innerHTML = data.map(exp => {

        const id =
          exp.id;

        const image =
          exp.image_url || '';

        const title =
          exp.title || 'Untitled Destination';

        const location =
          exp.location || 'Unknown location';


        // Rating
        const rating =
          exp.rating ||
          exp.average_rating ||
          exp.review_rating ||
          '4.5';


        // Category
        const category =
          exp.category_name ||
          exp.category ||
          'Destinations';


        // Duration
        const duration =
          exp.duration ||
          exp.duration_text ||
          '';


        // Travelers
        const travelers =
          exp.travelers ||
          exp.traveler_range ||
          '';


        // Price
        const price =
          Number(exp.price || 0);


        return `

          <article
            class="group flex flex-col gap-4 cursor-pointer experience-card"
            data-id="${id}"
          >

            <!-- IMAGE -->

            <div
              class="relative overflow-hidden rounded-xl aspect-[4/3] bg-surface-container"
            >

              <img
                class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.03]"
                src="${image}"
                alt="${title}"
              />


              <!-- RATING -->

              <div
                class="absolute top-3 right-3 bg-surface-container-lowest/90 backdrop-blur-sm px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm border border-outline-variant/10"
              >

                <span
                  class="material-symbols-outlined text-tertiary-container text-[14px]"
                  style="font-variation-settings: 'FILL' 1;"
                >
                  star
                </span>

                <span class="text-label-md font-label-md text-on-surface">
                  ${rating}
                </span>

              </div>


              <!-- ARROW -->

              <div
                class="absolute bottom-3 right-3 bg-surface-container-lowest text-on-surface w-10 h-10 rounded-full flex items-center justify-center shadow-sm border border-outline-variant/10 transition-transform duration-300 group-hover:scale-110 group-hover:bg-primary group-hover:text-on-primary"
              >

                <span class="material-symbols-outlined text-[20px]">
                  north_east
                </span>

              </div>

            </div>


            <!-- CARD INFORMATION -->

            <div class="flex flex-col gap-2 px-1">


              <!-- LOCATION + CATEGORY -->

              <div class="flex items-center justify-between gap-2">

                <div
                  class="flex items-center gap-1 text-on-surface-variant text-label-md font-label-md min-w-0"
                >

                  <span class="material-symbols-outlined text-[16px]">
                    location_on
                  </span>

                  <span class="truncate">
                    ${location}
                  </span>

                </div>


                <span
                  class="bg-primary-fixed text-primary px-2.5 py-0.5 rounded-full text-[12px] font-medium tracking-wide whitespace-nowrap"
                >
                  ${category}
                </span>

              </div>


              <!-- TITLE -->

              <h3
                class="text-headline-md font-headline-md text-on-surface group-hover:text-primary transition-colors"
              >
                ${title}
              </h3>


              <!-- META -->

              ${
                duration || travelers
                  ? `
                    <div
                      class="flex items-center gap-4 text-on-surface-variant text-label-md font-label-md"
                    >

                      ${
                        duration
                          ? `
                            <div class="flex items-center gap-1">

                              <span class="material-symbols-outlined text-[16px]">
                                schedule
                              </span>

                              <span>
                                ${duration}
                              </span>

                            </div>
                          `
                          : ''
                      }


                      ${
                        travelers
                          ? `
                            <div class="flex items-center gap-1">

                              <span class="material-symbols-outlined text-[16px]">
                                person
                              </span>

                              <span>
                                ${travelers}
                              </span>

                            </div>
                          `
                          : ''
                      }

                    </div>
                  `
                  : ''
              }


              <!-- PRICE -->

              <div class="mt-2 flex flex-col">

                <span class="text-[12px] text-on-surface-variant">
                  From
                </span>

                <div class="flex items-baseline gap-1">

                  <span
                    class="text-price-display font-price-display text-primary"
                  >
                    €${price.toFixed(2)}
                  </span>

                  <span
                    class="text-label-md font-label-md text-on-surface-variant"
                  >
                    / person
                  </span>

                </div>

              </div>

            </div>

          </article>

        `;

      }).join('');


      // ========================================
      // PAGINATION
      // ========================================

      renderPagination(data.length);


      // ========================================
      // CARD CLICK
      // ========================================

      container
        .querySelectorAll('.experience-card')
        .forEach(card => {

          card.addEventListener('click', async () => {

            try {

              const sessionRes =
                await fetch('/session');


              const session =
                await sessionRes.json();


              // ========================================
              // USER NOT LOGGED IN
              // ========================================

              if (!session.loggedIn) {

                window.location.href =
                  `/login.html?redirect=${encodeURIComponent(
                    window.location.href
                  )}`;

                return;
              }


              // ========================================
              // GET TID
              // ========================================

              const id =
                card.dataset.id;


              console.log(
                'Opening activity destination:',
                id
              );


              // ========================================
              // GO TO ACTIVITIES
              // ========================================

              window.location.href =
                `/activities.html?id=${id}`;

            } catch (error) {

              console.error(
                '❌ Session check failed:',
                error
              );


              window.location.href =
                `/login.html?redirect=${encodeURIComponent(
                  window.location.href
                )}`;

            }

          });

        });


    } catch (error) {

      console.error(
        '❌ Explore loading error:',
        error
      );


      container.innerHTML = `
        <div class="col-span-full text-center py-16">

          <span
            class="material-symbols-outlined text-[40px] text-on-surface-variant"
          >
            cloud_off
          </span>

          <h3
            class="mt-3 text-headline-md font-headline-md text-on-surface"
          >
            Unable to load destinations
          </h3>

          <p class="mt-2 text-on-surface-variant text-label-md">
            Please try again.
          </p>

        </div>
      `;


      if (pagination) {
        pagination.innerHTML = '';
      }

    }

  }


  // ========================================
  // PAGINATION
  // ========================================

  function renderPagination(currentBatchSize) {

    if (!pagination) return;


    const hasPrevious =
      currentPage > 1;


    const hasNext =
      currentBatchSize >= limit;


    pagination.innerHTML = `

      <button
        type="button"
        onclick="changePage(${currentPage - 1})"
        class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center
        ${
          !hasPrevious
            ? 'opacity-40 cursor-not-allowed'
            : 'hover:bg-surface-container'
        }"
        ${!hasPrevious ? 'disabled' : ''}
      >

        <span class="material-symbols-outlined text-[18px]">
          chevron_left
        </span>

      </button>


      <span
        class="min-w-10 h-10 px-3 rounded-full bg-primary text-on-primary flex items-center justify-center font-medium"
      >
        ${currentPage}
      </span>


      <button
        type="button"
        onclick="changePage(${currentPage + 1})"
        class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center
        ${
          !hasNext
            ? 'opacity-40 cursor-not-allowed'
            : 'hover:bg-surface-container'
        }"
        ${!hasNext ? 'disabled' : ''}
      >

        <span class="material-symbols-outlined text-[18px]">
          chevron_right
        </span>

      </button>

    `;

  }


  // ========================================
  // CHANGE PAGE
  // ========================================

  window.changePage = function(page) {

    if (page < 1) return;

    currentPage = page;

    fetchexplore();


    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  };


  // ========================================
  // SORT BUTTONS
  // ========================================

  document
    .querySelectorAll('.sort-btn')
    .forEach(btn => {

      btn.addEventListener('click', () => {

        currentSort =
          btn.dataset.sort || '';

        currentPage = 1;


        document
          .querySelectorAll('.sort-btn')
          .forEach(b => {

            b.classList.remove(
              'border-b-[#111418]',
              'text-[#111418]'
            );

            b.classList.add(
              'border-b-transparent',
              'text-[#60758a]'
            );

          });


        btn.classList.add(
          'border-b-[#111418]',
          'text-[#111418]'
        );

        btn.classList.remove(
          'border-b-transparent',
          'text-[#60758a]'
        );


        fetchexplore();

      });

    });


  // ========================================
  // SEARCH
  // ========================================

  searchInput?.addEventListener(
    'input',
    event => {

      searchTerm =
        event.target.value.trim();

      currentPage = 1;

      fetchexplore();

    }
  );


  // ========================================
  // INITIAL LOAD
  // ========================================

  fetchexplore();

});
</script>
<script src="/js/auth-guard.js"></script>
<script src="/js/button-loader.js"></script>
<script src="/js/language-selector.js"></script>
</body>
</html>
