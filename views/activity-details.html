<script>

document.addEventListener('DOMContentLoaded', async () => {

  const page = document.getElementById('activity-page');

  const params = new URLSearchParams(window.location.search);

  const activityId = params.get('id');


  // ========================================
  // CHECK ID
  // ========================================

  if (!activityId || isNaN(activityId)) {

    showError('Invalid activity ID.');

    return;

  }


  try {

    page.classList.add('activity-loading');


    // ========================================
    // GET ACTIVITY
    // ========================================

    const response = await fetch(
      `/api/activities/${encodeURIComponent(activityId)}`,
      {
        credentials: 'include'
      }
    );


    let data = {};

    try {
      data = await response.json();
    } catch {
      data = {};
    }


    if (!response.ok) {

      throw new Error(
        data.message ||
        data.error ||
        'Activity could not be loaded.'
      );

    }


    console.log('✅ Activity loaded:', data);


    // ========================================
    // POPULATE ACTIVITY
    // ========================================

    populateActivity(data);


    // ========================================
    // CHECK WISHLIST
    // ========================================

    await loadWishlist(activityId);


  } catch (error) {

    console.error(
      '❌ Activity details error:',
      error
    );

    showError(
      error.message ||
      'Unable to load this activity.'
    );

  } finally {

    page.classList.remove('activity-loading');

  }

});


// ========================================
// POPULATE ACTIVITY
// ========================================

function populateActivity(activity) {

  const title =
    activity.title ||
    'Untitled Activity';

  const location =
    activity.location ||
    'Location unavailable';

  const description =
    activity.description ||
    'No description available for this activity.';

  const category =
    activity.category_name ||
    'Activity';

  const image =
    activity.image_url ||
    activity.image ||
    '';


  // ========================================
  // TITLE
  // ========================================

  const titleElement =
    document.getElementById('activity-title');

  if (titleElement) {
    titleElement.textContent = title;
  }


  document.title =
    `${title} | Fast Life Travel`;


  // ========================================
  // PRICE
  // ========================================

  const priceElement =
    document.getElementById('activity-price');

  if (priceElement) {

    const priceNumber =
      Number(activity.price);

    if (!isNaN(priceNumber)) {

      priceElement.textContent =
        `€${priceNumber.toFixed(2)}/Person`;

    } else {

      priceElement.textContent =
        `${activity.price || '--'}/Person`;

    }

  }


  // ========================================
  // LOCATION
  // ========================================

  const locationElement =
    document.getElementById('activity-location');

  if (locationElement) {
    locationElement.textContent = location;
  }


  const locationInfo =
    document.getElementById('activity-location-info');

  if (locationInfo) {
    locationInfo.textContent = location;
  }


  const mapLocation =
    document.getElementById('map-location');

  if (mapLocation) {
    mapLocation.textContent = location;
  }


  // ========================================
  // CATEGORY
  // ========================================

  const categoryElement =
    document.getElementById('activity-category');

  if (categoryElement) {
    categoryElement.textContent = category;
  }


  const categoryInfo =
    document.getElementById('activity-category-info');

  if (categoryInfo) {
    categoryInfo.textContent = category;
  }


  // ========================================
  // DESCRIPTION
  // ========================================

  const descriptionElement =
    document.getElementById('activity-description');

  if (descriptionElement) {

    descriptionElement.textContent =
      description;

  }


  // ========================================
  // AVAILABLE DATE
  // ========================================

  const dateElement =
    document.getElementById('activity-date');

  if (dateElement) {

    if (activity.date_available) {

      const date =
        new Date(activity.date_available);

      if (!isNaN(date.getTime())) {

        dateElement.textContent =
          date.toLocaleDateString(
            undefined,
            {
              year: 'numeric',
              month: 'short',
              day: 'numeric'
            }
          );

      } else {

        dateElement.textContent =
          activity.date_available;

      }

    } else {

      dateElement.textContent =
        'Not specified';

    }

  }


  // ========================================
  // IMAGE
  // ========================================

  const mainImage =
    document.getElementById('activity-image');

  const thumb1 =
    document.getElementById('thumb-1');

  const thumb2 =
    document.getElementById('thumb-2');

  const thumb3 =
    document.getElementById('thumb-3');


  if (image) {

    if (mainImage) {

      mainImage.src = image;
      mainImage.alt = title;

    }


    if (thumb1) {
      thumb1.src = image;
      thumb1.alt = title;
    }


    if (thumb2) {
      thumb2.src = image;
      thumb2.alt = title;
    }


    if (thumb3) {
      thumb3.src = image;
      thumb3.alt = title;
    }

  }

}


// ========================================
// LOAD WISHLIST
// ========================================

async function loadWishlist(activityId) {

  try {

    const response =
      await fetch('/api/wishlist', {
        credentials: 'include'
      });


    if (!response.ok) {

      // Not logged in is okay here.
      // The user will be redirected when
      // they actually try to add it.

      return;

    }


    const wishlist =
      await response.json();


    const exists =
      Array.isArray(wishlist) &&
      wishlist.some(
        item =>
          Number(item.id) === Number(activityId) ||
          Number(item.activity_id) === Number(activityId)
      );


    updateWishlistUI(exists);

  } catch (error) {

    console.error(
      'Wishlist loading error:',
      error
    );

  }

}


// ========================================
// WISHLIST BUTTON
// ========================================

document
  .getElementById('wishlist-btn')
  ?.addEventListener(
    'click',
    async () => {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const activityId =
        Number(params.get('id'));


      if (!activityId) {
        return;
      }


      const button =
        document.getElementById(
          'wishlist-btn'
        );

      const icon =
        document.getElementById(
          'wishlist-icon'
        );


      if (button.disabled) {
        return;
      }


      button.disabled = true;


      try {

        // ========================================
        // CHECK SESSION FIRST
        // ========================================

        const sessionResponse =
          await fetch('/session', {
            credentials: 'include'
          });


        const session =
          await sessionResponse.json();


        if (!session.loggedIn) {

          window.location.href =
            `/login.html?redirect=${encodeURIComponent(
              window.location.href
            )}`;

          return;

        }


        // ========================================
        // DETERMINE CURRENT STATE
        // ========================================

        const isCurrentlyAdded =
          icon.classList.contains(
            'fill-red-500'
          );


        const method =
          isCurrentlyAdded
            ? 'DELETE'
            : 'POST';


        // ========================================
        // UPDATE WISHLIST
        // ========================================

        const response =
          await fetch('/api/wishlist', {

            method,

            headers: {
              'Content-Type': 'application/json'
            },

            credentials: 'include',

            body: JSON.stringify({
              activity_id: activityId
            })

          });


        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }


        // ========================================
        // ERROR
        // ========================================

        if (!response.ok) {

          // IMPORTANT:
          // Redirect to login instead of
          // showing "Please login" alert.

          if (response.status === 401) {

            window.location.href =
              `/login.html?redirect=${encodeURIComponent(
                window.location.href
              )}`;

            return;

          }


          throw new Error(
            data.error ||
            data.message ||
            'Wishlist update failed.'
          );

        }


        // ========================================
        // SUCCESS
        // ========================================

        updateWishlistUI(
          !isCurrentlyAdded
        );


        // ========================================
        // ANIMATION
        // ========================================

        icon.classList.remove(
          'scale-100'
        );

        icon.classList.add(
          'scale-125'
        );


        setTimeout(() => {

          icon.classList.remove(
            'scale-125'
          );

          icon.classList.add(
            'scale-100'
          );

        }, 180);


      } catch (error) {

        console.error(
          '❌ Wishlist error:',
          error
        );


        alert(
          error.message ||
          'Unable to update wishlist.'
        );

      } finally {

        button.disabled = false;

      }

    }
  );


// ========================================
// UPDATE WISHLIST UI
// ========================================

function updateWishlistUI(isAdded) {

  const button =
    document.getElementById(
      'wishlist-btn'
    );

  const icon =
    document.getElementById(
      'wishlist-icon'
    );


  if (!button || !icon) {
    return;
  }


  if (isAdded) {

    icon.classList.remove(
      'fill-none',
      'text-white'
    );

    icon.classList.add(
      'fill-red-500',
      'text-red-500'
    );


    button.setAttribute(
      'aria-label',
      'Remove from wishlist'
    );


  } else {

    icon.classList.remove(
      'fill-red-500',
      'text-red-500'
    );

    icon.classList.add(
      'fill-none',
      'text-white'
    );


    button.setAttribute(
      'aria-label',
      'Add to wishlist'
    );

  }

}

          >

            <path
              d="M12 9v4m0 4h.01M10.29 3.86l-7.82 14a2 2 0 001.74 3h15.58a2 2 0 001.74-3l-7.82-14a2 2 0 00-3.48 0z"

        </h2>


        <p class="text-sm text-gray-500 mb-6">

        </p>

// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(value) {

  const div =
    document.createElement('div');

  div.textContent =
    String(value ?? '');

  return div.innerHTML;

}

<script>

  const bookBtn = document.getElementById('book-btn');

  if (!bookBtn) {
    console.error('❌ Book button not found.');
    return;
  }

  bookBtn.addEventListener('click', () => {

    if (!activityId) {
      console.error('❌ Activity ID not found in URL.');
      alert('Activity information could not be found.');
      return;

    // Same booking flow used by the Wishlist "Book Now" button
    window.location.href =

  });

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const wishlistCount = document.getElementById('wishlist-count');

  if (!wishlistCount) return;

  try {
    const res = await fetch('/api/wishlist', {
      credentials: 'include'
    });

    if (!res.ok) {
      wishlistCount.textContent = '0';
      return;
    }

    const wishlist = await res.json();

    if (Array.isArray(wishlist)) {
      wishlistCount.textContent = wishlist.length;
    } else {
      wishlistCount.textContent = '0';
    }

  } catch (error) {
    console.error('❌ Failed to load wishlist count:', error);
    wishlistCount.textContent = '0';
  }
});
</script>
